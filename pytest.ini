[pytest]
addopts = -s -v # Опция для автоматического добавления флагов в терминале
                # при запуске тестов команда pytest будет автоматически включать флаги -s и -v
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*


markers =
    users: Маркировка для тестов связанных с пользователями
    regression: Маркировка для регрессионных тестов
    authentication: Маркировка для тестов, связанных с аутентификацией